<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img" aria-label="Rag&#x27;bat zinapoyasi" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="860" height="330" rx="14" fill="#ffffff"/><rect width="860" height="330" rx="14" fill="none" stroke="#cbd5e0"/><text x="22" y="34" font-size="17" fill="#1a202c" text-anchor="start" font-weight="700">K2 · Rag&#x27;bat zinapoyasi: shartli to&#x27;lov yuki</text><text x="22" y="56" font-size="12.5" fill="#718096" text-anchor="start" font-weight="400">100 = o&#x27;rnatilmagan holat (5× koeffitsient); qiymatlar shartli indeks</text><rect x="60.0" y="96.0" width="128.0" height="166.0" rx="8" fill="#c53030" opacity="0.85"/><text x="124" y="84.0" font-size="17" fill="#c53030" text-anchor="middle" font-weight="700">100</text><text x="124" y="66.0" font-size="12.5" fill="#718096" text-anchor="middle" font-weight="400">5× jazo</text><text x="124" y="284" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="600">Hech nima</text><rect x="250.0" y="179.0" width="128.0" height="83.0" rx="8" fill="#b7791f" opacity="0.85"/><text x="314" y="167.0" font-size="17" fill="#b7791f" text-anchor="middle" font-weight="700">50</text><text x="314" y="149.0" font-size="12.5" fill="#718096" text-anchor="middle" font-weight="400">−50%</text><text x="314" y="284" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="600">Fon stansiyasi</text><rect x="440.0" y="212.2" width="128.0" height="49.8" rx="8" fill="#2f855a" opacity="0.85"/><text x="504" y="200.2" font-size="17" fill="#2f855a" text-anchor="middle" font-weight="700">30</text><text x="504" y="182.2" font-size="12.5" fill="#718096" text-anchor="middle" font-weight="400">−70%</text><text x="504" y="284" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="600">+ Tozalash</text><rect x="630.0" y="212.2" width="128.0" height="49.8" rx="8" fill="#2b6cb0" opacity="0.85"/><text x="694" y="200.2" font-size="17" fill="#2b6cb0" text-anchor="middle" font-weight="700">30</text><text x="694" y="182.2" font-size="12.5" fill="#718096" text-anchor="middle" font-weight="400">likvidlik</text><text x="694" y="284" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="600">36 oy bo&#x27;lib</text><line x1="40.0" y1="262.0" x2="830.0" y2="262.0" stroke="#cbd5e0" stroke-width="1.5"/><text x="42" y="302" font-size="12" fill="#718096" text-anchor="start" font-weight="400">Izoh: «+ Tozalash» va «36 oy» — bir xil yuk, lekin 36 oylik imtiyozda u vaqt bo&#x27;yicha taqsimlanadi.</text></svg>